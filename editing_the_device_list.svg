<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#eef2f6"/><rect x="30" y="25" width="1140" height="600" rx="14" fill="#fff"/>
<rect x="30" y="25" width="1140" height="56" rx="14" fill="#101820"/><text x="60" y="61" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Meraki MAC-to-hostname renamer</text>
<text x="70" y="130" fill="#17202a" font-family="Arial" font-size="28" font-weight="700">1. Add MAC address and hostname pairs</text><text x="70" y="165" fill="#52606d" font-family="Arial" font-size="17">Open rename_meraki_clients.py and edit the DEVICES list.</text>
<rect x="70" y="195" width="1060" height="340" rx="10" fill="#121820"/><rect x="70" y="195" width="1060" height="38" rx="10" fill="#e9edf1"/><circle cx="94" cy="214" r="6" fill="#ff6159"/><circle cx="114" cy="214" r="6" fill="#ffbd2e"/><circle cx="134" cy="214" r="6" fill="#28c941"/><text x="160" y="220" fill="#4b5563" font-family="Arial" font-size="14">rename_meraki_clients.py</text>
<g font-family="Menlo,monospace" font-size="17"><text x="100" y="275" fill="#7f8c98"># Replace these examples with your devices.</text><text x="100" y="315" fill="#82aaff">DEVICES = [</text><text x="120" y="355" fill="#c3e88d">{"mac": "54:14:f3:69:66:2b", "hostname": "LAPTOP-001"},</text><text x="120" y="395" fill="#c3e88d">{"mac": "A0-B1-C2-D3-E4-F5", "hostname": "LAPTOP-002"},</text><text x="100" y="435" fill="#82aaff">]</text><text x="100" y="490" fill="#7f8c98"># Keep the API key out of this file.</text></g>
<rect x="70" y="560" width="1060" height="44" rx="5" fill="#f0faef"/><rect x="70" y="560" width="6" height="44" fill="#36a832"/><text x="94" y="588" fill="#245b29" font-family="Arial" font-size="16" font-weight="700">Save the file after replacing the examples with your real devices.</text>
</svg>
