<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#eef2f6"/><rect x="30" y="25" width="1140" height="650" rx="14" fill="#fff"/><rect x="30" y="25" width="1140" height="56" rx="14" fill="#101820"/><text x="60" y="61" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Dry run, review, then apply</text>
<text x="65" y="125" fill="#17202a" font-family="Arial" font-size="27" font-weight="700">3. Run safely from Terminal</text><text x="65" y="157" fill="#52606d" font-family="Arial" font-size="16">Start without --apply. Add it only after the preview is correct.</text>
<rect x="65" y="185" width="1070" height="400" rx="9" fill="#121820"/><rect x="65" y="185" width="1070" height="38" rx="9" fill="#e9edf1"/><circle cx="89" cy="204" r="6" fill="#ff6159"/><circle cx="109" cy="204" r="6" fill="#ffbd2e"/><circle cx="129" cy="204" r="6" fill="#28c941"/><text x="155" y="210" fill="#4b5563" font-family="Arial" font-size="14">Terminal</text>
<g font-family="Menlo,monospace" font-size="16"><text x="95" y="265" fill="#d6deeb">$ export MERAKI_DASHBOARD_API_KEY='your-api-key'</text><text x="95" y="300" fill="#d6deeb">$ export MERAKI_ORGANIZATION_ID='737160'</text><text x="95" y="350" fill="#d6deeb">$ python3 rename_meraki_clients.py --insecure</text><text x="95" y="385" fill="#f78c6c">WARNING: TLS certificate verification is disabled.</text><text x="95" y="430" fill="#82aaff">"mode": <tspan fill="#c3e88d">"dry-run"</tspan></text><text x="95" y="465" fill="#82aaff">"counts": {"would_update": 2}</text><text x="650" y="350" fill="#d6deeb">$ python3 rename_meraki_clients.py --insecure --apply</text><text x="650" y="395" fill="#82aaff">"mode": <tspan fill="#c3e88d">"apply"</tspan></text><text x="650" y="430" fill="#82aaff">"counts": {"updated": 2}</text><text x="650" y="465" fill="#c3e88d">"status": "updated"</text></g><line x1="605" y1="245" x2="605" y2="545" stroke="#35404d" stroke-width="2"/>
<rect x="65" y="610" width="1070" height="42" rx="5" fill="#fff8dc"/><rect x="65" y="610" width="6" height="42" fill="#e1a600"/><text x="90" y="636" fill="#6d5500" font-family="Arial" font-size="16" font-weight="700">Preferred: install your corporate CA. Use --insecure only on a trusted network.</text>
</svg>
